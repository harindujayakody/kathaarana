name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild: refreshes the ratings baked into each page's structured data.
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys of main queue in "pages" (the newest waiting one wins, which already has every change).
# Pull-request builds never deploy, so they get their own group per PR: otherwise a PR build
# waiting in "pages" would replace, and so cancel, a waiting deploy of main.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/admin/content.test.mjs
      - run: node scripts/indexnow.test.mjs

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v4
        with:
          node-version: 22
      # IndexNow: the pages this build adds or changes, compared with the live sitemap (still the old site here).
      # Sent to the search engines by the indexnow job, once the deploy is live.
      - if: github.ref == 'refs/heads/main'
        run: node scripts/indexnow.mjs plan https://kathaarana.com/sitemap-0.xml dist/sitemap-0.xml > indexnow-urls.txt
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.txt

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tells Bing and the other IndexNow engines about new and changed pages (scripts/indexnow.mjs).
  # A failure here shows in the run but doesn't undo the deploy.
  indexnow:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-urls
      - run: node scripts/indexnow.mjs send indexnow-urls.txt
